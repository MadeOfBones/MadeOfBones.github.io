<div class="window code-window" {{- with .Attributes.id }}id="{{ . }}"{{- end }}>
  <div class="window-title-bar-container">
    <div class="svgfilter-layer" style="filter: url(#gradient-map-green);">
      <div class="svgfilter-layer overlay-noise overlay-noise-white" style="filter: url(#posterize-5step);">
        <div class="svgfilter-layer window-title-bar-background">

        </div>
      </div>
    </div>
    <div class="window-title-bar">
      <div class="window-title-bar-title">
        {{- with .Attributes.title }}{{ . }}{{- end }}
      </div>
      <div class="window-title-bar-buttons">
        <label for="toc-toggle" class="window-title-bar-button">
          {{ partial "icons/maximize.html" (dict "id" "toc-icon-maximize") }}
          {{ partial "icons/minimize.html" (dict "id" "toc-icon-minimize") }}
        </label>
      </div>
    </div>
  </div>
  <div class="window-toolbar">
    <input class="window-toolbar-button copy-code-button" type="button" value="Copy" />
  </div>
  <div class="window-body code-window-body">
    <div class="code-window-content">
      {{ $result := transform.HighlightCodeBlock . }}
      {{ $result.Wrapped }}
    </div>
  </div>
</div>
